<body>
    <div class="main">
        <div class="container">
            <form class="announcement-form" id="announcement-form">
                <h2>Edit Your Announcement</h2>
                <div class="form-group-1">
                    <input matInput [(ngModel)]="announcement.title" type="text" name="title" id="title"
                        required />
                    <input matInput [(ngModel)]="announcement.author" type="text" name="author" id="author"
                        required />
                    <textarea [(ngModel)]="announcement.message" type="text" name="message" id="message"></textarea>
                    <textarea [(ngModel)]="announcement.description" type="text" name="description" id="description"></textarea>


                    <div class="select-list">
                        <label>Select A Category:</label>
                        <select [(ngModel)]="announcement.category" name="category" id="category"> 
                            <option *ngFor="let category of categories" [ngValue]="category.name">
                                {{ category.name }}
                            </option>
                        </select>
                    </div>

                    <div class="select-list">
                        <label>Select an Image:</label>
                        <select [(ngModel)]="announcement.imageUrl" name="image" id="image">
                            <option *ngFor="let img of images" [ngValue]="img">
                                {{img}}
                            </option>
                        </select>
                    </div>
                </div>

                <div class="form-buttons">
                    <button mat-button routerLink="home" class="submit">Cancel</button>
                    <button mat-button routerLink="home" class="submit" (click)="editEvent()">Add</button>
                </div>
            </form>
        </div>

    </div>
</body>
